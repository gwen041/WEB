<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website 07</title>
    <link rel="stylesheet" href="/Website07/style.css">
</head>
<body>

    <h1>Register!</h1>
    <p style="padding-bottom:20px">Fill out the details. </p>
        <form action="index.php" method="post">

            <div class="container">

                <div>
                    <label for="fName">First Name:</label>
                    <input type="text" id="fName" placeholder="Jestaly">  <br><br>

                    <label for="lName">Last Name:</label>
                    <input type="text" id="lName" placeholder="Castillo"> <br><br>
                    
                    <label for="bdate">Birthdate:</label>
                    <input type="date" id="bdate"> <br><br>

                    <label for="age">Age:</label>
                    <input type="number" id="age" min="1" max="99" placeholder="18"> <br><br>
                    

                    
                </div>

                <div>
                    <label for="phoneNum">Phone#:</label>
                    <input type="tel" id="phoneNum" placeholder="0912-345-6789" pattern="[0-9]{4}-[0-9]{3}-[0-9]{4}"> <br><br>

                    <label for="userN">Username:</label>
                    <input type="text" id="userN" placeholder="jespogi123"> <br><br>

                    <label for="email">Email:</label>
                    <input type="email" id="email" placeholder="jcastillo@gmail.com"> <br><br>

                    <label for="title">Title:</label>

                    <label for="Ms.">Ms.</label>
                    <input type="radio" id="Ms." value="Ms." name="title">

                    <label for="Mr.">Mr.</label>
                    <input type="radio" id="Mr." value="Mr." name="title">

                    <label for="Mx.">Mx.</label>
                    <input type="radio" id="Mx." value="Mx." name="title">

                    <label for="PhD">PhD.</label>
                    <input type="radio" id="PhD." value="PhD" name="title">

                </div>

            </div>


            <div id="box1">
                <input type="submit">
                <input type="reset"> 

            </div>

        </form>

        



    
</body>
</html>
