<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>
</head>
<body>

  <div class="form-container">
    <h1>Student's Registration Form</h1>

    <form action="/Activity05/submit.html">
      
      <label for="rollno">Roll no.:</label>
      <input type="text" id="rollno">

      <label>Student Name:</label>
        <div class="name-inputs">
          <input type="text" placeholder="First Name">
          <input type="text" placeholder="Last Name">
        </div>

      <label for="mother">Mother's Name:</label>
      <input type="text" id="mother" placeholder="Your Mother's name">

      <label for="father">Father's Name:</label>
      <input type="text" id="father" placeholder="Your Father's name">

      <label for="date">Date of birth:</label>
      <input type="date" id="date">

      <label for="number">Mobile no.:</label>
      <input type="tel" value="+91 " id="number">

      <label for="email">Email:</label>
      <input type="email" id="email" placeholder="almira12@gmail.com">

      <label for="password">Password:</label>
      <input type="password" id="password">

      <label>Gender:</label>
        <div class="radio-group">
          <input type="radio" name="gender" id="male"> <label for="male">Male</label>
          <input type="radio" name="gender" id="female"> <label for="female">Female</label>
        </div>

      <label>Department:</label>
        <div class="checkbox-group">
          <input type="checkbox" id="cse"> <label for="cse">CSE</label>
          <input type="checkbox" id="it"> <label for="it">IT</label>
          <input type="checkbox" id="ece"> <label for="ece">ECE</label>
          <input type="checkbox" id="civil"> <label for="civil">Civil</label>
          <input type="checkbox" id="mech"> <label for="mech">Mech</label>
        </div>

      <label for="course">Course:</label>
        <select id="course">
          <option>BSCS</option>
          <option>BSIT</option>
          <option>BSECE</option>
        </select>

      <label for="photo">Student photo:</label>
      <input type="file" id="photo">

      <label for="city">City:</label>
      <input type="text" id="city">

      <label for="address">Address:</label>
      <textarea id="address" rows="3"></textarea>

      <div class="button-group">
        <input type="submit" value="Register">
        <input type="reset" value="Clear">
      </div>
      
    </form>
  </div>
  
</body>
</html>
