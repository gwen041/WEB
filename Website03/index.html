<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/Website03/style.css" rel="stylesheet">
    <link rel="icon" type="image/jpg" href="image/icon.jpg">
    <title>Website03</title>
</head>
<body>
    <div style="display: flex; justify-content: center; align-items: center;">
        <button onclick="changeText()" style="background-color:#6cbd9b; border-radius:5px; height:50px; width:100px;">Click</button> 
    </div>

    <p id="test" style="font-size:50px">I love</p> 

    <script>
        function changeText() {
            document.getElementById("test").innerHTML = "Jeszyy"
            
            setTimeout(() => {
                document.getElementById("test").innerHTML = "and Gwen"
            }, 2000)
        }
    </script>
 
</body>
</html>
