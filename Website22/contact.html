<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/Website22/style.css">
  <title>Contact</title>
</head>
<body>

  <div class="frmcontainer">
     
    <form action="">

      <label for="uname">Name:</label>
      <input type="text" name="uname" id="name" placeholder="Jes Castillo">

      <label for="email">Email:</label>
      <input type="email" name="email" id="email" placeholder="jespogifr14@gmail.com">

      <label for="subject">Subject</label>
      <input type="text" name="subject" id="subject"><br>

      <label for="message">Share your stories:</label>
      <textarea name="message" id="message" cols="40" rows="15"></textarea>

      <input type="submit" value="Submit">
    </form>
  </div>
  
</body>
</html>
